# Gateway API fixture, read with network.yaml by the network graph's Gateway tests and served by every fake API server (so the demo shows it).
# edge/public: a healthy Gateway behind an Envoy LoadBalancer (HTTP + HTTPS listeners, a TLS certificate, a cross-namespace backend allowed by a ReferenceGrant).
# edge/internal: Envoy behind a ClusterIP Service: a route with a missing backend, a route from another namespace the listener does not accept, a TCPRoute.
# edge/azure: Application Gateway for Containers (controller outside the cluster): a missing certificate and a GRPCRoute to another namespace with no grant for its kind.
# edge/lost: a GatewayClass its controller does not accept: nothing serves it. Objects of network.yaml are not touched.
