# What --demo shows on the Network graph for its own workloads (web and api in default, checkout in production): the EndpointSlices their Services lacked,
# a public Ingress (ingress-nginx LoadBalancer) and an internal one (ClusterIP controller), an Envoy Gateway behind a LoadBalancer in front of checkout and an
# Application Gateway for Containers Gateway in front of api. The controllers, classes and namespaces are the ones of network.yaml and gateway.yaml.
{"apiVersion": "discovery.k8s.io/v1", "kind": "EndpointSlice", "metadata": {"name": "web-abc12", "namespace": "default", "labels": {"kubernetes.io/service-name": "web"}}, "addressType": "IPv4", "endpoints": [{"addresses": ["10.244.0.10"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "web-5d8f7c-ax0k"}}, {"addresses": ["10.244.0.11"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "web-5d8f7c-bx1k"}}, {"addresses": ["10.244.0.12"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "web-5d8f7c-cx2k"}}], "ports": []}
---
{"apiVersion": "discovery.k8s.io/v1", "kind": "EndpointSlice", "metadata": {"name": "api-abc12", "namespace": "default", "labels": {"kubernetes.io/service-name": "api"}}, "addressType": "IPv4", "endpoints": [{"addresses": ["10.244.0.10"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "api-5d8f7c-ax0k"}}, {"addresses": ["10.244.0.11"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "api-5d8f7c-bx1k"}}], "ports": []}
---
{"apiVersion": "discovery.k8s.io/v1", "kind": "EndpointSlice", "metadata": {"name": "checkout-abc12", "namespace": "production", "labels": {"kubernetes.io/service-name": "checkout"}}, "addressType": "IPv4", "endpoints": [{"addresses": ["10.244.0.10"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "checkout-5d8f7c-ax0k"}}, {"addresses": ["10.244.0.11"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "checkout-5d8f7c-bx1k"}}, {"addresses": ["10.244.0.12"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "checkout-5d8f7c-cx2k"}}], "ports": []}
---
{"apiVersion": "networking.k8s.io/v1", "kind": "Ingress", "metadata": {"name": "web", "namespace": "default", "annotations": {}}, "spec": {"ingressClassName": "nginx", "rules": [{"host": "demo.example.com", "http": {"paths": [{"path": "/", "pathType": "Prefix", "backend": {"service": {"name": "web", "port": {"number": 80}}}}, {"path": "/api", "pathType": "Prefix", "backend": {"service": {"name": "api", "port": {"number": 8080}}}}]}}]}}
---
{"apiVersion": "networking.k8s.io/v1", "kind": "Ingress", "metadata": {"name": "api-internal", "namespace": "default", "annotations": {}}, "spec": {"ingressClassName": "nginx-private", "rules": [{"host": "api.internal.example.com", "http": {"paths": [{"path": "/", "pathType": "Prefix", "backend": {"service": {"name": "api", "port": {"number": 8080}}}}]}}]}}
---
{"apiVersion": "gateway.networking.k8s.io/v1", "kind": "Gateway", "metadata": {"name": "checkout", "namespace": "production"}, "spec": {"gatewayClassName": "envoy", "listeners": [{"name": "http", "port": 80, "protocol": "HTTP", "hostname": "checkout.demo.example.com", "allowedRoutes": {"namespaces": {"from": "Same"}}}]}, "status": {"conditions": [{"type": "Accepted", "status": "True", "reason": "Accepted"}, {"type": "Programmed", "status": "True", "reason": "Programmed"}], "addresses": [{"type": "IPAddress", "value": "20.4.5.7"}]}}
---
{"apiVersion": "v1", "kind": "Service", "metadata": {"name": "envoy-production-checkout", "namespace": "gateway-system", "labels": {"gateway.envoyproxy.io/owning-gateway-name": "checkout", "gateway.envoyproxy.io/owning-gateway-namespace": "production"}, "annotations": {}}, "spec": {"type": "LoadBalancer", "ports": [{"port": 80, "targetPort": 10080}], "selector": {"app": "envoy-checkout"}}, "status": {"loadBalancer": {"ingress": [{"ip": "20.4.5.7"}]}}}
---
{"apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "metadata": {"name": "checkout", "namespace": "production"}, "spec": {"parentRefs": [{"name": "checkout"}], "rules": [{"matches": [{"path": {"type": "PathPrefix", "value": "/"}}], "backendRefs": [{"name": "checkout", "port": 8080}]}]}, "status": {"parents": [{"parentRef": {"name": "checkout"}, "controllerName": "gateway.envoyproxy.io/gatewayclass-controller", "conditions": [{"type": "Accepted", "status": "True", "reason": "Accepted"}, {"type": "ResolvedRefs", "status": "True", "reason": "ResolvedRefs"}]}]}}
---
{"apiVersion": "gateway.networking.k8s.io/v1", "kind": "Gateway", "metadata": {"name": "shared", "namespace": "default"}, "spec": {"gatewayClassName": "agc", "listeners": [{"name": "http", "port": 80, "protocol": "HTTP", "hostname": "*.demo.example.com", "allowedRoutes": {"namespaces": {"from": "Same"}}}]}, "status": {"conditions": [{"type": "Accepted", "status": "True", "reason": "Accepted"}, {"type": "Programmed", "status": "True", "reason": "Programmed"}], "addresses": [{"type": "Hostname", "value": "demo123.fz34.alb.azure.com"}]}}
---
{"apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "metadata": {"name": "api", "namespace": "default"}, "spec": {"parentRefs": [{"name": "shared"}], "hostnames": ["api.demo.example.com"], "rules": [{"matches": [{"path": {"type": "PathPrefix", "value": "/"}}], "backendRefs": [{"name": "api", "port": 8080}]}]}, "status": {"parents": [{"parentRef": {"name": "shared"}, "controllerName": "alb.networking.azure.io/alb-controller", "conditions": [{"type": "Accepted", "status": "True", "reason": "Accepted"}, {"type": "ResolvedRefs", "status": "True", "reason": "ResolvedRefs"}]}]}}
